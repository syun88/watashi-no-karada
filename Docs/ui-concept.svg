<text x="1235" y="885" class="jp h" font-size="21">04 履歴・分析</text><text x="1235" y="913" class="jp s" font-size="15">数値と3DのBefore / After。</text>

<text x="800" y="963" text-anchor="middle" class="jp s" font-size="18">PRIVACY FIRST · ON-DEVICE LiDAR · SWIFTUI · SWIFTDATA · METAL</text>
