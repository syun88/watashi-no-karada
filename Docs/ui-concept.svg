  <rect x="22" y="516" width="276" height="68" rx="17" class="card"/><text x="40" y="543" class="h" font-size="14">8月30日</text><text x="40" y="566" class="s" font-size="13">84.2 cm　72.8 kg</text></g>
  <rect x="22" y="603" width="276" height="18" rx="9" fill="#e7eff9"/><rect x="22" y="603" width="185" height="18" rx="9" fill="url(#cta)"/>
