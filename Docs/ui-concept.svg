  <rect x="22" y="143" width="276" height="265" rx="24" fill="#071f44"/>
  <g opacity=".92">
    <circle cx="160" cy="205" r="5" fill="#4df0c2"/><circle cx="137" cy="220" r="4" fill="#2bbef2"/><circle cx="181" cy="223" r="4" fill="#2bbef2"/>
    <circle cx="126" cy="252" r="4" fill="#54e5a9"/><circle cx="194" cy="253" r="4" fill="#54e5a9"/><circle cx="141" cy="278" r="4" fill="#2bbef2"/><circle cx="179" cy="278" r="4" fill="#2bbef2"/>
    <circle cx="132" cy="310" r="5" fill="#4df0c2"/><circle cx="188" cy="310" r="5" fill="#4df0c2"/><circle cx="144" cy="344" r="4" fill="#2bbef2"/><circle cx="177" cy="344" r="4" fill="#2bbef2"/>
    <circle cx="150" cy="376" r="5" fill="#4df0c2"/><circle cx="170" cy="376" r="5" fill="#4df0c2"/>
  </g>
  <text x="192" y="382" class="jp" fill="#a9c7e5" font-size="11">On-device splats</text>
  <rect x="22" y="426" width="132" height="92" rx="20" class="card"/><rect x="166" y="426" width="132" height="92" rx="20" class="card"/>
  <text x="38" y="453" class="jp s" font-size="13">ウエスト</text><text x="38" y="488" class="jp h" font-size="24">82.4 cm</text>
  <text x="182" y="453" class="jp s" font-size="13">お腹</text><text x="182" y="488" class="jp h" font-size="24">86.1 cm</text>
  <rect x="22" y="533" width="276" height="70" rx="20" fill="#e9fff8"/><text x="40" y="561" class="jp teal" font-size="14">前回からウエスト -1.8 cm</text><text x="40" y="584" class="jp s" font-size="12">同じ撮影条件で比較すると変化を追いやすい</text>
</g>
<text x="860" y="885" class="jp h" font-size="21">03 結果・3D</text><text x="860" y="913" class="jp s" font-size="15">寸法はLiDAR、見た目はGaussian splats。</text>

